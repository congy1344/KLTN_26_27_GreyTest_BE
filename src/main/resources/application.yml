spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: greytest
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/greytest}
    username: ${SPRING_DATASOURCE_USERNAME:greytest}
    password: ${SPRING_DATASOURCE_PASSWORD:greytest_password}
  jpa:
    hibernate:
      # Flyway quản lý schema; JPA chỉ validate entity khớp với DB
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Thư mục lưu source code đã upload/clone
greytest:
  storage:
    path: ${GREYTEST_STORAGE_PATH:./storage}
  auth:
    token-secret: ${GREYTEST_AUTH_TOKEN_SECRET:}
  usage:
    default-monthly-llm-quota: ${GREYTEST_DEFAULT_MONTHLY_LLM_QUOTA:100}
  llm-cache:
    max-entries: ${GREYTEST_LLM_CACHE_MAX_ENTRIES:500}
  ai-context-log-path: ${GREYTEST_AI_CONTEXT_LOG_PATH:../log}
  ai-context-log-enabled: ${GREYTEST_AI_CONTEXT_LOG_ENABLED:false}
  ai-context-log-console-enabled: ${GREYTEST_AI_CONTEXT_LOG_CONSOLE_ENABLED:false}

# API key LLM lấy từ env, KHÔNG commit (xem .env.example)
llm:
  provider: ${LLM_PROVIDER:mock}
  api-key: ${LLM_API_KEY:}
  api-key-fallback: ${LLM_API_KEY1:}
  api-key-2: ${LLM_API_KEY2:}
  api-key-3: ${LLM_API_KEY3:}
  api-key-4: ${LLM_API_KEY4:}
  api-key-5: ${LLM_API_KEY5:}
  api-key-6: ${LLM_API_KEY6:}
  api-key-7: ${LLM_API_KEY7:}
  model: ${LLM_MODEL:gpt-4o-mini}
  openai-model: ${LLM_OPENAI_MODEL:${LLM_MODEL:gpt-4o-mini}}
  google-model: ${LLM_GOOGLE_MODEL:${LLM_MODEL:gemini-3.5-flash}}
  temperature: ${LLM_TEMPERATURE:0.3}
  # Test case/unit test JSON tiếng Việt rất tốn token; 4096 từng gây cắt cụt response giữa chừng
  max-tokens: ${LLM_MAX_TOKENS:16384}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  openai-url: ${LLM_OPENAI_URL:https://api.openai.com/v1/chat/completions}
  google-url: ${LLM_GOOGLE_URL:https://generativelanguage.googleapis.com/v1beta/interactions}
  usage:
    enabled: ${LLM_USAGE_ENABLED:false}
    output-dir: ${LLM_USAGE_OUTPUT_DIR:../log/llm-usage}
    run-id: ${LLM_USAGE_RUN_ID:}
    method: ${LLM_USAGE_METHOD:GREYTEST}
