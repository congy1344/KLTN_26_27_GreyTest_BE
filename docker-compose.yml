services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: greytest
      POSTGRES_USER: greytest
      POSTGRES_PASSWORD: greytest_password
    ports:
      # Host 5433 để tránh đụng Postgres native (nếu có) đang chiếm 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/greytest
      SPRING_DATASOURCE_USERNAME: greytest
      SPRING_DATASOURCE_PASSWORD: greytest_password
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_KEY1: ${LLM_API_KEY1:-}
      LLM_API_KEY2: ${LLM_API_KEY2:-}
      LLM_API_KEY3: ${LLM_API_KEY3:-}
      LLM_API_KEY4: ${LLM_API_KEY4:-}
      LLM_API_KEY5: ${LLM_API_KEY5:-}
      LLM_API_KEY6: ${LLM_API_KEY6:-}
      LLM_API_KEY7: ${LLM_API_KEY7:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_OPENAI_URL: ${LLM_OPENAI_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MAX_TOKENS_BUSINESS_RULE: ${LLM_MAX_TOKENS_BUSINESS_RULE:-4096}
      LLM_MAX_TOKENS_BUSINESS_RULE_REVIEW: ${LLM_MAX_TOKENS_BUSINESS_RULE_REVIEW:-4096}
      LLM_MAX_TOKENS_TEST_PLAN: ${LLM_MAX_TOKENS_TEST_PLAN:-6144}
      LLM_MAX_TOKENS_TEST_CASE: ${LLM_MAX_TOKENS_TEST_CASE:-8192}
      LLM_MAX_TOKENS_UNIT_TEST: ${LLM_MAX_TOKENS_UNIT_TEST:-12288}
      LLM_MAX_TOKENS_COVERAGE_REFINEMENT: ${LLM_MAX_TOKENS_COVERAGE_REFINEMENT:-6144}
      GREYTEST_LLM_BATCH_CONCURRENCY: ${GREYTEST_LLM_BATCH_CONCURRENCY:-2}
      LLM_USAGE_ENABLED: ${LLM_USAGE_ENABLED:-false}
      LLM_USAGE_OUTPUT_DIR: ${LLM_USAGE_OUTPUT_DIR:-/app/log/llm-usage}
      LLM_USAGE_RUN_ID: ${LLM_USAGE_RUN_ID:-}
      LLM_USAGE_METHOD: ${LLM_USAGE_METHOD:-GREYTEST}
      GREYTEST_AUTH_TOKEN_SECRET: ${GREYTEST_AUTH_TOKEN_SECRET:-}
      GREYTEST_DEFAULT_MONTHLY_LLM_QUOTA: ${GREYTEST_DEFAULT_MONTHLY_LLM_QUOTA:-100}
      GREYTEST_STORAGE_PATH: /app/storage
      GREYTEST_AI_CONTEXT_LOG_ENABLED: ${GREYTEST_AI_CONTEXT_LOG_ENABLED:-false}
      GREYTEST_AI_CONTEXT_LOG_CONSOLE_ENABLED: ${GREYTEST_AI_CONTEXT_LOG_CONSOLE_ENABLED:-false}
      GREYTEST_AI_CONTEXT_LOG_PATH: /app/log
    volumes:
      - backend_storage:/app/storage
      - ../log:/app/log
    depends_on:
      - postgres

  # ponytail: FE chạy local bằng `npm run dev` (proxy /api -> :8080) cho tới khi cần deploy.
  # Thêm service frontend + Dockerfile khi build production.

volumes:
  postgres_data:
  backend_storage:
